<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Quiz App</title>
    <style>
        body { font-family: Arial; padding: 50px; background: #f4f4f4; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        button { padding: 10px 15px; margin-top: 10px; background: #3498db; color: white; border: none; cursor: pointer; }
        button:hover { background: #2980b9; }
        .quiz-link { margin-top: 20px; text-align: center; cursor: pointer; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Quiz</h2>
        <div id="quiz"></div>
        <button onclick="submitQuiz()">Submit</button>
        <div id="result"></div>
        <div class="quiz-link" onclick="logout()">Logout</div>
    </div>

    <script>
        const currentUser = localStorage.getItem('currentUser');
        if(!currentUser) window.location.href = "login.html";

        const quizData = [
            { question: "Монгол улсын нийслэл аль хот вэ?", options: ["Улаанбаатар", "Дархан", "Эрдэнэт"], answer: "Улаанбаатар" },
            { question: "JavaScript ямар төрлийн хэл вэ?", options: ["Backend", "Frontend", "Programming Language"], answer: "Programming Language" },
            { question: "HTML ямар зорилготой вэ?", options: ["Өгөгдөл хадгалах", "Веб бүтэц үүсгэх", "Дизайн хийх"], answer: "Веб бүтэц үүсгэх" }
        ];

        const quizDiv = document.getElementById('quiz');
        quizData.forEach((q, index) => {
            const qDiv = document.createElement('div');
            qDiv.innerHTML = `<p>${index+1}. ${q.question}</p>`;
            q.options.forEach(opt => {
                qDiv.innerHTML += `<label><input type="radio" name="q${index}" value="${opt}"> ${opt}</label>`;
            });
            quizDiv.appendChild(qDiv);
        });

        function submitQuiz() {
            let score = 0;
            quizData.forEach((q,index)=>{
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if(selected && selected.value===q.answer) score++;
            });
            document.getElementById('result').textContent = `Таны оноо: ${score} / ${quizData.length}`;
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
